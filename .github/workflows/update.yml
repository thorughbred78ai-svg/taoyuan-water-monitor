name: Update Taoyuan Water Data

on:
workflow_dispatch:
schedule:
- cron: "*/30 * * * *"

permissions:
contents: write

concurrency:
group: taoyuan-water-update
cancel-in-progress: true

jobs:
update:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 1

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
      cache: "pip"

  - name: Check Python environment
    run: |
      python --version
      python -m pip --version

  - name: Install Python dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt

  - name: Check GIS environment
    run: |
      python - <<'PY'
      import geopandas
      import rasterio
      import shapely
      import pyproj
      import requests

      print("GeoPandas:", geopandas.__version__)
      print("Rasterio:", rasterio.__version__)
      print("Shapely:", shapely.__version__)
      print("PyProj:", pyproj.__version__)
      print("Requests:", requests.__version__)
      PY

  - name: Validate Python source
    run: |
      python -m py_compile \
        src/config.py \
        src/wra_client.py \
        src/rainfall_processor.py \
        src/main.py

  - name: Validate Taoyuan boundary
    run: |
      python - <<'PY'
      import geopandas as gpd

      path = "data/boundary/taoyuan_districts.geojson"

      print("Loading:", path)

      gdf = gpd.read_file(path)

      print("CRS:", gdf.crs)
      print("Feature count:", len(gdf))

      if gdf.empty:
          raise RuntimeError(
              "Taoyuan boundary is empty"
          )

      if gdf.crs is None:
          raise RuntimeError(
              "Boundary CRS is missing"
          )

      if len(gdf) != 13:
          print(
              "WARNING: expected 13 districts,"
              f" got {len(gdf)}"
          )

      print()
      print("Taoyuan boundary validation OK.")
      PY

  - name: Run WRA API diagnostic
    id: wra_diagnostic
    continue-on-error: true
    env:
      PYTHONUNBUFFERED: "1"
    run: |
      python src/main.py

  - name: Show generated files
    if: always()
    run: |
      echo "======================================"
      echo "Generated files"
      echo "======================================"

      if [ -d "data/latest" ]; then
        find data/latest \
          -maxdepth 4 \
          -type f \
          -print \
          | sort
      else
        echo "data/latest does not exist"
      fi

  - name: Show rainfall processing output
    if: always()
    run: |
      echo "======================================"
      echo "Rainfall processing output"
      echo "======================================"

      if [ -f "data/latest/rainfall_statistics.json" ]; then
        echo
        echo "----- rainfall_statistics.json -----"
        cat "data/latest/rainfall_statistics.json"
        echo
      else
        echo "rainfall_statistics.json not found."
      fi

      if [ -f "data/latest/raw/rainfall.bin.metadata.json" ]; then
        echo
        echo "----- rainfall.bin.metadata.json -----"
        cat "data/latest/raw/rainfall.bin.metadata.json"
        echo
      else
        echo "rainfall metadata not found."
      fi

  - name: Show WRA error responses
    if: always()
    run: |
      echo "======================================"
      echo "WRA error responses"
      echo "======================================"

      if [ -d "data/latest" ]; then
        find data/latest \
          -type f \
          \( \
            -name "*.error.txt" \
            -o \
            -name "*.error.json" \
          \) \
          -print \
          -exec sh -c '
            echo
            echo "----- $1 -----"
            cat "$1"
            echo
          ' _ {} \;
      else
        echo "No data/latest directory."
      fi

  - name: Show WRA response headers
    if: always()
    run: |
      echo "======================================"
      echo "WRA response headers"
      echo "======================================"

      if [ -d "data/latest" ]; then
        find data/latest \
          -type f \
          -name "*.headers.json" \
          -print \
          -exec sh -c '
            echo
            echo "----- $1 -----"
            cat "$1"
            echo
          ' _ {} \;
      fi

  - name: Show diagnostic status
    if: always()
    run: |
      echo "======================================"
      echo "Diagnostic status"
      echo "======================================"

      if [ -f "data/latest/status.json" ]; then
        cat "data/latest/status.json"
      else
        echo "status.json not found."
      fi

  - name: Commit diagnostic data
    if: always()
    run: |
      git config \
        user.name \
        "github-actions[bot]"

      git config \
        user.email \
        "41898282+github-actions[bot]@users.noreply.github.com"

      git add data/latest/

      if git diff --cached --quiet; then
        echo "No data changes."
      else
        git commit \
          -m "chore: update WRA diagnostic data" \
          || true

        git push \
          || true
      fi

  - name: Final diagnostic status
    if: always()
    run: |
      echo "======================================"
      echo "WRA diagnostic finished"
      echo "======================================"

      echo "Check the previous steps for:"
      echo "1. Python compilation"
      echo "2. Taoyuan boundary validation"
      echo "3. precipitation API response"
      echo "4. rainfall PNG inspection"
      echo "5. rainfall GeoTIFF generation"
      echo "6. rainfall processing JSON"
      echo "7. inundation API response"
      echo "8. HTTP response headers"
      echo "9. API error body"
      echo "10. generated diagnostic files"
