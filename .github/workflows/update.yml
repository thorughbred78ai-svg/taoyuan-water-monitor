name: Update Taoyuan Water Data

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions 使用 UTC
    # 這裡是每 30 分鐘執行一次
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: taoyuan-water-update
  cancel-in-progress: true

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # --------------------------------------------------
      # 3. Install GDAL / PROJ
      # --------------------------------------------------
      - name: Install system GIS packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            proj-bin \
            libproj-dev

          gdalinfo --version
          ogrinfo --version

      # --------------------------------------------------
      # 4. Install Python dependencies
      # --------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 5. Validate boundary
      # --------------------------------------------------
      - name: Validate Taoyuan boundary
        run: |
          python - <<'PY'
          import geopandas as gpd

          path = "data/boundary/taoyuan_districts.geojson"

          gdf = gpd.read_file(path)

          print(gdf)

          if gdf.empty:
              raise RuntimeError("Taoyuan boundary is empty")

          if gdf.crs is None:
              raise RuntimeError("Boundary CRS is missing")

          print("CRS:", gdf.crs)
          print("Features:", len(gdf))
          PY

      # --------------------------------------------------
      # 6. Run ETL
      # --------------------------------------------------
      - name: Run water data ETL
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python src/main.py

      # --------------------------------------------------
      # 7. Validate generated files
      # --------------------------------------------------
      - name: Validate generated data
        run: |
          test -f data/latest/status.json
          test -f data/latest/district_status.json

          python - <<'PY'
          import json

          for filename in [
              "data/latest/status.json",
              "data/latest/district_status.json",
          ]:
              with open(filename, encoding="utf-8") as f:
                  data = json.load(f)

              print(filename)
              print(json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )[:3000])
          PY

      # --------------------------------------------------
      # 8. Show git diff
      # --------------------------------------------------
      - name: Show changes
        run: |
          git status --short
          git diff --stat

      # --------------------------------------------------
      # 9. Commit generated data
      # --------------------------------------------------
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest/

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit \
              -m "chore: update Taoyuan water data"

            git push
          fi
