name: Update Taoyuan Water Data

on:

  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"


permissions:
  contents: write


concurrency:

  group: taoyuan-water-update

  cancel-in-progress: true


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 1


      # ==================================================
      # 2. Setup Python
      # ==================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

          cache: "pip"


      # ==================================================
      # 3. Check Python environment
      # ==================================================

      - name: Check Python environment

        run: |

          python --version

          python -m pip --version


      # ==================================================
      # 4. Install Python dependencies
      # ==================================================

      - name: Install Python dependencies

        run: |

          python -m pip install \
            --upgrade pip

          python -m pip install \
            -r requirements.txt


      # ==================================================
      # 5. Check GIS environment
      # ==================================================

      - name: Check GIS environment

        run: |

          python - <<'PY'

          import geopandas
          import rasterio
          import shapely
          import pyproj
          import requests

          print(
              "GeoPandas:",
              geopandas.__version__
          )

          print(
              "Rasterio:",
              rasterio.__version__
          )

          print(
              "Shapely:",
              shapely.__version__
          )

          print(
              "PyProj:",
              pyproj.__version__
          )

          print(
              "Requests:",
              requests.__version__
          )

          PY


      # ==================================================
      # 6. Validate Python source
      # ==================================================

      - name: Validate Python source

        run: |

          python -m py_compile \
            src/config.py \
            src/wra_client.py \
            src/main.py


      # ==================================================
      # 7. Validate Taoyuan boundary
      # ==================================================

      - name: Validate Taoyuan boundary

        run: |

          python - <<'PY'

          import geopandas as gpd

          path = \
            "data/boundary/taoyuan_districts.geojson"

          print(
              "Loading:",
              path
          )

          gdf = gpd.read_file(path)

          print(
              "CRS:",
              gdf.crs
          )

          print(
              "Feature count:",
              len(gdf)
          )

          if gdf.empty:

              raise RuntimeError(
                  "Taoyuan boundary is empty"
              )

          if gdf.crs is None:

              raise RuntimeError(
                  "Boundary CRS is missing"
              )

          if len(gdf) != 13:

              print(
                  "WARNING:"
                  " expected 13 districts,"
                  f" got {len(gdf)}"
              )

          print()
          print(
              "Taoyuan boundary validation OK."
          )

          PY


      # ==================================================
      # 8. Run WRA API diagnostic
      # ==================================================
      #
      # IMPORTANT:
      #
      # Do not stop the workflow here.
      #
      # main.py is intentionally allowed to return
      # a non-zero exit code so that both APIs can be
      # tested and their error responses collected.
      #
      # ==================================================

      - name: Run WRA API diagnostic

        id: wra_diagnostic

        continue-on-error: true

        env:

          PYTHONUNBUFFERED: "1"

        run: |

          python src/main.py


      # ==================================================
      # 9. Show generated files
      # ==================================================

      - name: Show generated files

        if: always()

        run: |

          echo "======================================"

          echo "Generated files"

          echo "======================================"

          if [ -d "data/latest" ]; then

            find data/latest \
              -maxdepth 4 \
              -type f \
              -print \
              | sort

          else

            echo "data/latest does not exist"

          fi


      # ==================================================
      # 10. Show WRA error responses
      # ==================================================

      - name: Show WRA error responses

        if: always()

        run: |

          echo "======================================"

          echo "WRA error responses"

          echo "======================================"

          if [ -d "data/latest" ]; then

            find data/latest \
              -type f \
              \( \
                -name "*.error.txt" \
                -o \
                -name "*.error.json" \
              \) \
              -print \
              -exec sh -c '
                echo
                echo "----- $1 -----"
                cat "$1"
                echo
              ' _ {} \;

          else

            echo "No data/latest directory."

          fi


      # ==================================================
      # 11. Show WRA headers
      # ==================================================

      - name: Show WRA response headers

        if: always()

        run: |

          echo "======================================"

          echo "WRA response headers"

          echo "======================================"

          if [ -d "data/latest" ]; then

            find data/latest \
              -type f \
              -name "*.headers.json" \
              -print \
              -exec sh -c '
                echo
                echo "----- $1 -----"
                cat "$1"
                echo
              ' _ {} \;

          fi


      # ==================================================
      # 12. Commit diagnostic data
      # ==================================================

      - name: Commit diagnostic data

        if: always()

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/latest/


          if git diff --cached --quiet; then

            echo "No data changes."

          else

            git commit \
              -m "chore: update WRA diagnostic data" \
              || true

            git push \
              || true

          fi


      # ==================================================
      # 13. Final status
      # ==================================================

      - name: Final diagnostic status

        if: always()

        run: |

          echo "======================================"

          echo "WRA diagnostic finished"

          echo "======================================"

          echo "Check the previous steps for:"

          echo "1. precipitation API response"

          echo "2. inundation API response"

          echo "3. HTTP response headers"

          echo "4. API error body"

          echo "5. generated diagnostic files"
