name: Update Taoyuan Water Data

on:

  workflow_dispatch:

  schedule:
    # 每 30 分鐘執行一次
    - cron: "*/30 * * * *"


permissions:
  contents: write


concurrency:

  group: taoyuan-water-update

  cancel-in-progress: true


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 1


      # ==================================================
      # 2. Python
      # ==================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

          cache: "pip"


      # ==================================================
      # 3. Install GIS libraries
      # ==================================================

      - name: Install system GIS packages

        run: |

          sudo apt-get update

          sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            proj-bin \
            libproj-dev

          echo "GDAL:"
          gdalinfo --version

          echo "OGR:"
          ogrinfo --version


      # ==================================================
      # 4. Install Python packages
      # ==================================================

      - name: Install Python dependencies

        run: |

          python -m pip install \
            --upgrade pip

          pip install \
            -r requirements.txt


      # ==================================================
      # 5. Validate Python
      # ==================================================

      - name: Validate Python source

        run: |

          python -m py_compile \
            src/config.py \
            src/wra_client.py \
            src/raster.py \
            src/spatial.py \
            src/main.py


      # ==================================================
      # 6. Validate boundary
      # ==================================================

      - name: Validate Taoyuan boundary

        run: |

          python - <<'PY'

          import geopandas as gpd

          path = (
              "data/boundary/"
              "taoyuan_districts.geojson"
          )

          print(
              "Loading:",
              path
          )

          gdf = gpd.read_file(path)

          print()
          print(gdf)
          print()

          print(
              "CRS:",
              gdf.crs
          )

          print(
              "Feature count:",
              len(gdf)
          )

          if gdf.empty:

              raise RuntimeError(
                  "Taoyuan boundary is empty"
              )

          if gdf.crs is None:

              raise RuntimeError(
                  "Boundary CRS is missing"
              )

          if len(gdf) != 13:

              print(
                  "WARNING:"
                  " expected 13 districts,"
                  f" got {len(gdf)}"
              )

          PY


      # ==================================================
      # 7. Run API diagnostic
      # ==================================================

      - name: Run WRA API diagnostic

        env:

          PYTHONUNBUFFERED: "1"

        run: |

          python src/main.py


      # ==================================================
      # 8. List generated diagnostic files
      # ==================================================

      - name: Show generated files

        if: always()

        run: |

          echo "======================================"

          echo "Generated files"

          echo "======================================"

          find data/latest \
            -maxdepth 3 \
            -type f \
            -print \
            | sort


      # ==================================================
      # 9. Show WRA error files
      # ==================================================

      - name: Show WRA error responses

        if: always()

        run: |

          echo "======================================"

          echo "WRA error responses"

          echo "======================================"

          find data/latest \
            -type f \
            \( \
              -name "*.error.txt" \
              -o \
              -name "*.error.json" \
            \) \
            -print \
            -exec sh -c '
              echo
              echo "----- $1 -----"
              cat "$1"
              echo
            ' _ {} \;


      # ==================================================
      # 10. Commit generated diagnostic data
      # ==================================================

      - name: Commit diagnostic data

        if: always()

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/latest/


          if git diff --cached --quiet; then

            echo "No data changes."

          else

            git commit \
              -m "chore: update WRA diagnostic data" \
              || true

            git push \
              || true

          fi
