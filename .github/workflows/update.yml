name: Update & Deploy Taoyuan Water Monitor

on:
  workflow_dispatch:
    inputs:
      rainfall_hours:
        description: "累積雨量小時數 (1~24)；取色階時可填 24 以提高出現降雨像素的機率"
        default: "1"
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "data/boundary/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

# 單一工作流程：產生資料 -> 直接部署 Pages（不再 commit 資料回 main，
# 避免 GITHUB_TOKEN 推送不會觸發其他 workflow、以及 repo 因每 30 分鐘 commit 而膨脹）
concurrency:
  group: taoyuan-water
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate source
        run: python -m py_compile src/*.py

      - name: Clean stale outputs
        run: rm -rf data/latest

      - name: Fetch WRA data and compute district statistics
        env:
          # 於 Settings → Variables 設定（非機密）；未設定則為空
          INUNDATION_PARAMS: ${{ vars.INUNDATION_PARAMS }}
          RAINFALL_CUMULATIVE_HOURS: ${{ inputs.rainfall_hours || '1' }}
        run: python src/main.py

      - name: Show results (debug)
        if: always()
        run: |
          for f in data/latest/status.json data/latest/district_status.json data/latest/rainfall_statistics.json data/latest/inundation_statistics.json; do
            echo "----- $f -----"; cat "$f" 2>/dev/null || echo "(not found)"
          done
          find data/latest/raw -name '*.error.txt' -exec sh -c 'echo "--- $1 ---"; head -c 3000 "$1"' _ {} \; 2>/dev/null || true

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-data
          path: data/latest/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp data/boundary/taoyuan_districts.geojson _site/data/
          cp data/latest/district_status.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update          # update 失敗 -> 不部署 -> 網站保留上一版有效資料
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
